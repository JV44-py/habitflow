{% extends 'core/base.html' %}
{% block title %}Calendar{% endblock %}

{% block body %}
<div class="app-layout">
  {% include 'core/partials/sidebar.html' %}

  <main class="main-content">
    <header class="top-bar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="btn btn-ghost btn-icon mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="fa fa-bars"></i></button>
        <span class="top-bar-title">Calendar</span>
      </div>
      <div class="top-bar-actions">
        <button class="btn btn-ghost btn-icon btn-sm" onclick="changeMonth(-1)"><i class="fa fa-chevron-left"></i></button>
        <span style="font-weight:600;font-size:.95rem;min-width:140px;text-align:center;" id="cal-title">–</span>
        <button class="btn btn-ghost btn-icon btn-sm" onclick="changeMonth(1)"><i class="fa fa-chevron-right"></i></button>
      </div>
    </header>

    <div class="page-content">
      <div class="two-col">

        <!-- Calendar -->
        <div class="card">
          <div class="card-ph">
            <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;">
              <span style="font-size:.7rem;color:var(--text-muted);font-weight:600;padding:6px;">Sun</span>
              <span style="font-size:.7rem;color:var(--text-muted);font-weight:600;padding:6px;">Mon</span>
              <span style="font-size:.7rem;color:var(--text-muted);font-weight:600;padding:6px;">Tue</span>
              <span style="font-size:.7rem;color:var(--text-muted);font-weight:600;padding:6px;">Wed</span>
              <span style="font-size:.7rem;color:var(--text-muted);font-weight:600;padding:6px;">Thu</span>
              <span style="font-size:.7rem;color:var(--text-muted);font-weight:600;padding:6px;">Fri</span>
              <span style="font-size:.7rem;color:var(--text-muted);font-weight:600;padding:6px;">Sat</span>
            </div>
          </div>
          <div style="padding:16px;">
            <div class="calendar-grid" id="cal-grid">
              <div class="skeleton" style="height:40px;border-radius:8px;grid-column:1/-1;"></div>
            </div>
          </div>

          <!-- Legend -->
          <div style="padding:0 16px 16px;display:flex;gap:12px;flex-wrap:wrap;">
            <div style="display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--text-secondary);">
              <div style="width:14px;height:14px;border-radius:4px;background:rgba(16,185,129,.1);"></div> 1–25%
            </div>
            <div style="display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--text-secondary);">
              <div style="width:14px;height:14px;border-radius:4px;background:rgba(16,185,129,.25);"></div> 26–50%
            </div>
            <div style="display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--text-secondary);">
              <div style="width:14px;height:14px;border-radius:4px;background:rgba(16,185,129,.5);"></div> 51–99%
            </div>
            <div style="display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--text-secondary);">
              <div style="width:14px;height:14px;border-radius:4px;background:var(--green);"></div> 100%
            </div>
          </div>
        </div>

        <!-- Day detail -->
        <div>
          <div class="card mb-4" id="day-detail" style="display:none;">
            <div class="card-ph">
              <span style="font-weight:700;" id="day-detail-title">–</span>
            </div>
            <div style="padding:16px;" id="day-detail-body"></div>
          </div>

          <!-- Month stats -->
          <div class="card">
            <div class="card-ph"><span style="font-weight:700;">Month Overview</span></div>
            <div style="padding:16px;display:flex;flex-direction:column;gap:12px;" id="month-stats">
              <div class="skeleton" style="height:36px;border-radius:8px;"></div>
              <div class="skeleton" style="height:36px;border-radius:8px;"></div>
              <div class="skeleton" style="height:36px;border-radius:8px;"></div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>
</div>

<script>
let currentYear  = new Date().getFullYear();
let currentMonth = new Date().getMonth() + 1;
let calData      = null;

async function loadCalendar(year, month) {
  if (!await requireAuth()) return;
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('cal-title').textContent = `${months[month-1]} ${year}`;

  try {
    calData = await API.calendar(year, month);
    renderCalendar(calData);
    renderMonthStats(calData);
  } catch(e) {
    showToast('Failed to load calendar', 'error');
  }
}

function changeMonth(delta) {
  currentMonth += delta;
  if (currentMonth > 12) { currentMonth = 1;  currentYear++; }
  if (currentMonth < 1)  { currentMonth = 12; currentYear--; }
  loadCalendar(currentYear, currentMonth);
}

function renderCalendar(d) {
  const today = new Date();
  const firstDow = new Date(d.year, d.month - 1, 1).getDay();
  const grid = document.getElementById('cal-grid');
  let html = '';

  // Empty leading cells
  for (let i = 0; i < firstDow; i++) {
    html += `<div class="cal-day empty"></div>`;
  }

  for (let day = 1; day <= d.days_in_month; day++) {
    const info    = d.calendar[day];
    const isToday = today.getFullYear() === d.year && today.getMonth()+1 === d.month && today.getDate() === day;
    let rateClass = '';
    if (info) {
      if      (info.rate === 100) rateClass = 'rate-full';
      else if (info.rate >= 51)   rateClass = 'rate-high';
      else if (info.rate >= 26)   rateClass = 'rate-mid';
      else if (info.rate >= 1)    rateClass = 'rate-low';
    }
    html += `<div class="cal-day ${rateClass} ${isToday ? 'today' : ''} ${info ? 'has-data' : ''}"
      onclick="showDayDetail(${day})"
      data-tooltip="${info ? info.completed + '/' + info.total + ' (' + info.rate + '%)' : 'No data'}"
    >${day}</div>`;
  }

  grid.innerHTML = html;
}

function showDayDetail(day) {
  const info = calData?.calendar[day];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('day-detail-title').textContent = `${months[currentMonth-1]} ${day}, ${currentYear}`;
  document.getElementById('day-detail').style.display = '';

  if (!info) {
    document.getElementById('day-detail-body').innerHTML = `<p style="color:var(--text-muted);font-size:.875rem;">No habit data for this day.</p>`;
    return;
  }

  const rateColor = info.rate >= 80 ? 'var(--green)' : info.rate >= 50 ? 'var(--accent)' : 'var(--amber)';
  document.getElementById('day-detail-body').innerHTML = `
    <div style="display:flex;align-items:center;gap:20px;margin-bottom:14px;">
      <div style="text-align:center;">
        <div style="font-size:2rem;font-weight:700;color:${rateColor};">${info.rate}%</div>
        <div style="font-size:.75rem;color:var(--text-muted);">completion</div>
      </div>
      <div style="flex:1;">
        <div class="progress-bar" style="height:10px;"><div class="progress-fill" style="width:${info.rate}%;background:${rateColor};"></div></div>
        <div style="font-size:.75rem;color:var(--text-muted);margin-top:4px;">${info.completed} of ${info.total} habits completed</div>
      </div>
    </div>
  `;
}

function renderMonthStats(d) {
  let totalCompleted = 0, totalPossible = 0, perfectDays = 0;
  Object.values(d.calendar).forEach(day => {
    totalCompleted += day.completed;
    totalPossible  += day.total;
    if (day.rate === 100) perfectDays++;
  });
  const overallRate = totalPossible ? Math.round(totalCompleted / totalPossible * 100) : 0;
  const activeDays  = Object.keys(d.calendar).length;

  document.getElementById('month-stats').innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px;background:var(--bg-hover);border-radius:10px;">
      <div style="display:flex;align-items:center;gap:8px;"><span style="font-size:1.2rem;">✅</span><span style="font-size:.875rem;">Total completions</span></div>
      <span style="font-weight:700;">${totalCompleted}</span>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px;background:var(--bg-hover);border-radius:10px;">
      <div style="display:flex;align-items:center;gap:8px;"><span style="font-size:1.2rem;">📊</span><span style="font-size:.875rem;">Overall rate</span></div>
      <span style="font-weight:700;color:var(--accent);">${overallRate}%</span>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px;background:var(--bg-hover);border-radius:10px;">
      <div style="display:flex;align-items:center;gap:8px;"><span style="font-size:1.2rem;">🌟</span><span style="font-size:.875rem;">Perfect days</span></div>
      <span style="font-weight:700;color:var(--green);">${perfectDays}</span>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px;background:var(--bg-hover);border-radius:10px;">
      <div style="display:flex;align-items:center;gap:8px;"><span style="font-size:1.2rem;">📅</span><span style="font-size:.875rem;">Active days</span></div>
      <span style="font-weight:700;">${activeDays}</span>
    </div>
  `;
}

loadCalendar(currentYear, currentMonth);
</script>
{% endblock %}
