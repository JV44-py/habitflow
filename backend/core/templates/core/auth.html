{% extends 'core/base.html' %}
{% block title %}Sign In{% endblock %}

{% block body %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg-base);">

  <!-- Background mesh -->
  <div style="position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;">
    <div style="position:absolute;top:-200px;left:-200px;width:600px;height:600px;background:radial-gradient(circle,rgba(99,102,241,.12) 0%,transparent 70%);border-radius:50%;"></div>
    <div style="position:absolute;bottom:-200px;right:-200px;width:600px;height:600px;background:radial-gradient(circle,rgba(139,92,246,.1) 0%,transparent 70%);border-radius:50%;"></div>
  </div>

  <div style="position:relative;z-index:1;width:100%;max-width:440px;">
    <!-- Logo -->
    <div style="text-align:center;margin-bottom:32px;" class="anim-fade-up">
      <div style="width:56px;height:56px;background:var(--accent);border-radius:16px;display:inline-flex;align-items:center;justify-content:center;font-size:28px;box-shadow:var(--shadow-glow);margin-bottom:14px;">🌱</div>
      <h1 style="font-family:var(--font-display);font-size:1.8rem;">HabitFlow</h1>
      <p style="color:var(--text-secondary);font-size:.875rem;margin-top:6px;">Build habits. Build yourself.</p>
    </div>

    <!-- Card -->
    <div class="card card-p anim-fade-up" style="animation-delay:.1s;">

      <!-- Tabs -->
      <div style="display:flex;background:var(--bg-hover);border-radius:10px;padding:4px;margin-bottom:24px;">
        <button class="btn w-full" id="tab-login"    onclick="switchTab('login')"    style="border-radius:8px;background:var(--bg-card);color:var(--text-primary);">Sign In</button>
        <button class="btn w-full btn-ghost" id="tab-register" onclick="switchTab('register')" style="border-radius:8px;">Create Account</button>
      </div>

      <!-- Login form -->
      <form id="form-login" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Email address</label>
          <input type="email" id="login-email" class="form-input" placeholder="you@example.com" required/>
        </div>
        <div class="form-group">
          <label class="form-label" style="display:flex;justify-content:space-between;">
            Password
            <a href="#" onclick="handleReset(event)" style="color:var(--accent);font-size:.75rem;">Forgot password?</a>
          </label>
          <div style="position:relative;">
            <input type="password" id="login-password" class="form-input" placeholder="••••••••" required/>
            <button type="button" onclick="togglePw('login-password',this)" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:.8rem;">👁</button>
          </div>
        </div>
        <div id="login-error" style="display:none;color:var(--red);font-size:.8rem;margin-bottom:12px;padding:10px;background:var(--red-light);border-radius:8px;"></div>
        <button type="submit" class="btn btn-primary w-full btn-lg" id="btn-login">
          <span id="btn-login-text">Sign In</span>
          <span id="btn-login-spinner" style="display:none;">⏳</span>
        </button>
      </form>

      <!-- Register form -->
      <form id="form-register" onsubmit="handleRegister(event)" style="display:none;">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div class="form-group">
            <label class="form-label">First Name</label>
            <input type="text" id="reg-first" class="form-input" placeholder="Jeremiah" required/>
          </div>
          <div class="form-group">
            <label class="form-label">Last Name</label>
            <input type="text" id="reg-last" class="form-input" placeholder="Cruz"/>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Email address</label>
          <input type="email" id="reg-email" class="form-input" placeholder="you@example.com" required/>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <div style="position:relative;">
            <input type="password" id="reg-password" class="form-input" placeholder="Min. 8 characters" minlength="8" required/>
            <button type="button" onclick="togglePw('reg-password',this)" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:.8rem;">👁</button>
          </div>
          <div id="pw-strength" style="margin-top:6px;height:4px;border-radius:99px;background:var(--bg-hover);overflow:hidden;">
            <div id="pw-strength-fill" style="height:100%;border-radius:99px;width:0;transition:width .3s,background .3s;"></div>
          </div>
        </div>
        <div id="reg-error" style="display:none;color:var(--red);font-size:.8rem;margin-bottom:12px;padding:10px;background:var(--red-light);border-radius:8px;"></div>
        <button type="submit" class="btn btn-primary w-full btn-lg" id="btn-register">
          <span id="btn-register-text">Create Account</span>
          <span id="btn-register-spinner" style="display:none;">⏳</span>
        </button>
        <p style="text-align:center;font-size:.75rem;color:var(--text-muted);margin-top:12px;">
          By signing up you agree to our terms of service.
        </p>
      </form>
    </div>

    <!-- Theme toggle -->
    <div style="text-align:center;margin-top:20px;">
      <button onclick="toggleTheme()" class="btn btn-ghost btn-sm" style="color:var(--text-muted);">
        <span id="t-icon">☀️</span> Toggle theme
      </button>
    </div>
  </div>
</div>

<script>
// Redirect if already logged in
(async () => {
  const s = await Auth.getSession();
  if (s) window.location.href = '/dashboard/';
  // Check URL for tab hint
  if (window.location.pathname.includes('register')) switchTab('register');
})();

function switchTab(tab) {
  const isLogin = tab === 'login';
  document.getElementById('form-login').style.display    = isLogin ? '' : 'none';
  document.getElementById('form-register').style.display = isLogin ? 'none' : '';

  const tl = document.getElementById('tab-login');
  const tr = document.getElementById('tab-register');
  if (isLogin) {
    tl.style.background = 'var(--bg-card)'; tl.style.color = 'var(--text-primary)';
    tr.style.background = 'transparent';    tr.style.color = 'var(--text-secondary)';
  } else {
    tr.style.background = 'var(--bg-card)'; tr.style.color = 'var(--text-primary)';
    tl.style.background = 'transparent';    tl.style.color = 'var(--text-secondary)';
  }
}

function setLoading(btnId, loading) {
  document.getElementById(btnId + '-text').style.display    = loading ? 'none' : '';
  document.getElementById(btnId + '-spinner').style.display = loading ? '' : 'none';
  document.getElementById('btn-' + btnId).disabled = loading;
}

function showError(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg; el.style.display = '';
}

async function handleLogin(e) {
  e.preventDefault();
  document.getElementById('login-error').style.display = 'none';
  setLoading('login', true);
  const email    = document.getElementById('login-email').value;
  const password = document.getElementById('login-password').value;
  const { error } = await Auth.signIn(email, password);
  setLoading('login', false);
  if (error) { showError('login-error', error.message); return; }
  window.location.href = '/dashboard/';
}

async function handleRegister(e) {
  e.preventDefault();
  document.getElementById('reg-error').style.display = 'none';
  setLoading('register', true);
  const first    = document.getElementById('reg-first').value;
  const last     = document.getElementById('reg-last').value;
  const email    = document.getElementById('reg-email').value;
  const password = document.getElementById('reg-password').value;
  const { error } = await Auth.signUp(email, password, first, last);
  setLoading('register', false);
  if (error) { showError('reg-error', error.message); return; }
  showToast('Account created! Check your email to verify.', 'success');
  setTimeout(() => switchTab('login'), 1500);
}

async function handleReset(e) {
  e.preventDefault();
  const email = document.getElementById('login-email').value;
  if (!email) { showError('login-error', 'Enter your email first.'); return; }
  const { error } = await Auth.resetPassword(email);
  if (error) { showError('login-error', error.message); return; }
  showToast('Password reset email sent!', 'info');
}

function togglePw(id, btn) {
  const input = document.getElementById(id);
  input.type = input.type === 'password' ? 'text' : 'password';
  btn.textContent = input.type === 'password' ? '👁' : '🙈';
}

// Password strength
document.getElementById('reg-password').addEventListener('input', function() {
  const pw = this.value;
  let score = 0;
  if (pw.length >= 8) score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;
  const fill = document.getElementById('pw-strength-fill');
  const colors = ['', '#ef4444', '#f59e0b', '#3b82f6', '#10b981'];
  fill.style.width   = (score * 25) + '%';
  fill.style.background = colors[score] || '';
});

// Theme icon
function updateThemeIcon() {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.getElementById('t-icon').textContent = dark ? '☀️' : '🌙';
}
updateThemeIcon();
const _orig = window.toggleTheme;
window.toggleTheme = () => { _orig(); updateThemeIcon(); };
</script>
{% endblock %}
